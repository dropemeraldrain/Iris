name: Build Plugin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17' # Возвращаем родную для этого кода Java 17
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5' # Принудительно ставим стабильный Gradle, который не требует Java 25

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build with Gradle
      run: gradle build -x test --parallel # Запускаем через глобальный gradle 8.5 вместо локального gradlew
