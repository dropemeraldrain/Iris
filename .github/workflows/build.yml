name: Build Plugin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Hard Clean Local Cache and buildSrc
      run: |
        rm -rf .gradle
        rm -rf build
        rm -rf buildSrc/.gradle
        rm -rf buildSrc/build
        find . -name "build" -type d -exec rm -rf {} + || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'
        cache-disabled: true # Полностью отключаем кэширование GitHub Actions на этот запуск

    - name: Build with Gradle
      run: gradle clean build -x test --parallel -PuseLocalVolmLib=false --no-build-cache --refresh-dependencies
