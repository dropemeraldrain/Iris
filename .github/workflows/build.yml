name: Build Plugin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Clean environment variables
      run: |
        rm -rf .gradle
        rm -rf buildSrc/build
        chmod +x ./gradlew

    - name: Total Compile and Build
      run: ./gradlew jar assemble -x test -x check --no-build-cache --stacktrace -PuseLocalVolmLib=false

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: assembled-plugins
        path: "**/build/libs/*.jar"
